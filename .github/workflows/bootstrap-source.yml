name: Import verified source archive
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  import-source:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Verify archive and import original paths and executable modes
        run: |
          python3 - <<'PY_IMPORT'
          import hashlib, json
          from pathlib import Path, PurePosixPath
          from zipfile import ZipFile
          archive = Path('RestoreChannelPost-Source-1.8.zip')
          assert hashlib.sha256(archive.read_bytes()).hexdigest() == '51b3e949f30208c0dd23c96b5e5f9587e36734f9f6d61dda3f749d451ee35deb'
          expected = {entry['path']: entry['sha256'] for entry in json.loads(Path('SOURCE-FILES.json').read_text())}
          found = set()
          with ZipFile(archive) as source:
              assert source.testzip() is None
              for entry in source.infolist():
                  if entry.is_dir():
                      continue
                  parts = PurePosixPath(entry.filename).parts
                  assert parts[0] == 'RestoreChannelPost' and '..' not in parts
                  relative = PurePosixPath(*parts[1:]).as_posix()
                  assert relative in expected and relative not in found
                  data = source.read(entry)
                  assert hashlib.sha256(data).hexdigest() == expected[relative]
                  found.add(relative)
                  # This original CI file is added through the owner UI next;
                  # the import job does not create or modify workflow files.
                  if relative == '.github/workflows/verify.yml':
                      continue
                  assert not relative.startswith('.git/') and not relative.startswith('.github/workflows/')
                  target = Path(relative)
                  target.parent.mkdir(parents=True, exist_ok=True)
                  target.write_bytes(data)
                  target.chmod(0o755 if (entry.external_attr >> 16) & 0o111 else 0o644)
          assert found == set(expected) and len(found) == 68
          archive.unlink()
          PY_IMPORT
          git config user.name 'github-actions[bot]'
          git config user.email 'github-actions[bot]@users.noreply.github.com'
          git add --all
          git commit -m "Import verified Restore Channel Post 1.8 sources"
          git push origin HEAD:main
