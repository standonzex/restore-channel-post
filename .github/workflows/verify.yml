name: Verify reference implementation
on: [push, pull_request, workflow_dispatch]
permissions:
  contents: read
jobs:
  mac-reference:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Verify module, server, client and Mac build
        run: ./verify.sh
  ios-simulator-build:
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Build the standalone iPhone reference demo
        run: ./build-ios-demo.sh
